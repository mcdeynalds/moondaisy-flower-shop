<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rincian Belanja</title>
       
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <main id="rincian" >
        <section class="keranjang">
            <div>
                <table class="tabel-keranjang" cellpadding="90px" cellspacing="10px">
                    <thead>
                        <tr>
                            <th>Produk</th>
                            <th>Jumlah</th>
                            <th>Harga</th>
                        </tr>
                    </thead>

                    <tbody>       
                        <tr>
                            <td class="produk-keranjang">
                                <span>1.</span>
                                <img src="assets/ee-shaped.jpg" alt="heart shaped" width="60px">
                                <span>Heart Shaped</span>
                            </td>
                            <td class="center">1</td>
                            <td class="center">Rp 950.000</td>
                        </tr>

                        <tr>
                            <td class="produk-keranjang">
                                <span>2.</span>
                                <img src="assets/a-indigo.jpg" alt="indigo flower" width="60px">
                                <span>Indigo Flower</span>
                            </td>
                            <td class="center">1</td>
                            <td class="center">Rp 1.550.000</td>
                        </tr>

                        <tr>
                            <td class="produk-keranjang">
                                <span>3.</span> 
                                <img src="assets/dd-ohara.jpg" alt="ohara box" width="60px">
                                <span>Ohara Box</span>
                            </td>
                            <td class="center">1</td>
                            <td class="center">Rp 2.250.000</td>
                        </tr>

                        <tr>
                            <th>Total</th>
                            <th >3</th>
                            <th>Rp. 4.350.000</th>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
